name: Quiz Fixer and Auto-Regenerator

on:
  schedule:
    # Run 4 times a day: every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  run-quiz-fixer:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r PyDaily/requirements.txt
      
      - name: Run Quiz Auto-Regeneration
        working-directory: ./PyDaily
        run: python scripts/fix_quizzes.py
