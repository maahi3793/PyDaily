name: Daily Email Scheduler

on:
  schedule:
    # 1. Morning Cycle: 08:00 IST (02:30 UTC)
    - cron: '30 2 * * *'
    # 2. Quiz Insights: 11:00 IST (05:30 UTC)
    - cron: '30 5 * * *'
    # 3. Mid-Day Motivation: 12:00 IST (06:30 UTC)
    - cron: '30 6 * * *'
    # 4. Evening Cycle: 20:00 IST (14:30 UTC)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose which cycle to run'
        required: true
        default: 'Morning Lessons'
        type: choice
        options:
        - Morning Lessons
        - Quiz Insights
        - Motivation Boost
        - Evening Reminders

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # ✅ FIX: Define secrets ONCE here. All steps below will inherit them.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
      
      # ✅ DEBUG STEP
      - name: Debug Secrets
        run: |
          python -c "import os; url = os.getenv('SUPABASE_URL', ''); print(f'DEBUG CHECK: URL Length is {len(url)}')"

      # 🕵️‍♂️ DETERMINE RUN MODE (Fixes Schedule Issue)
      - name: Determine Run Mode
        id: mode
        run: |
          # 1. Default to manual input content if available
          MODE=""
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
             echo "🔹 Manual Trigger Detected: ${{ github.event.inputs.action }}"
             case "${{ github.event.inputs.action }}" in
               "Morning Lessons") MODE="morning" ;;
               "Quiz Insights") MODE="insights" ;;
               "Motivation Boost") MODE="motivation" ;;
               "Evening Reminders") MODE="evening" ;;
             esac
          elif [ "${{ github.event_name }}" == "schedule" ]; then
             # 2. Time-Based Logic (UTC)
             HOUR=$(date -u +'%H:%M')
             echo "🔹 Schedule Trigger Detected. UTC Time: $HOUR"
             
             # Approx matching (cron might delay slightly, so we match broad windows if needed, but exact is fine for now)
             # Cron: 02:30, 05:30, 06:30, 14:30
             
             # Note: We use grep for partial match to be safe against ':31' etc.
             if [[ "$HOUR" == "02:"* ]]; then
                MODE="morning"
             elif [[ "$HOUR" == "05:"* ]]; then
                MODE="insights"
             elif [[ "$HOUR" == "06:"* ]]; then
                MODE="motivation"
             elif [[ "$HOUR" == "14:"* ]]; then
                MODE="evening"
             fi
          fi
          
          if [ -z "$MODE" ]; then
            echo "❌ Could not determine mode! Exiting."
            exit 1
          fi
          
          echo "✅ Selected Mode: $MODE"
          echo "MODE=$MODE" >> $GITHUB_ENV

      # 🚀 EXECUTE BOT
      - name: Run Bot
        if: env.MODE != ''
        run: python run_bot.py --mode ${{ env.MODE }}
