name: Daily Email Scheduler

on:
  schedule:
    # 1. Morning Cycle: 08:00 IST (02:30 UTC)
    - cron: '30 2 * * *'
    # 2. Quiz Insights: 17:30 IST (23:00 UTC) -> 3h after Evening
    - cron: '30 17 * * *'
    # 3. Mid-Day Motivation: 12:00 IST (06:30 UTC)
    - cron: '30 6 * * *'
    # 4. Evening Cycle: 20:00 IST (14:30 UTC)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose which cycle to run'
        required: true
        default: 'Morning Lessons'
        type: choice
        options:
        - Morning Lessons
        - Quiz Insights
        - Motivation Boost
        - Evening Reminders
        - Regenerate Content
      target_day:
        description: 'Day Number (Only for Regeneration)'
        required: false
        default: '0'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r PyDaily/requirements.txt
      
      - name: Run PyDaily Bot
        working-directory: ./PyDaily
        run: |
          # Use manual override if workflow_dispatch was used, else use 'auto'
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
             if [ "${{ github.event.inputs.action }}" == "Regenerate Content" ]; then
                python run_bot.py --mode regenerate --day ${{ github.event.inputs.target_day }}
             elif [ "${{ github.event.inputs.action }}" == "Morning Lessons" ]; then
                python run_bot.py --mode morning
             elif [ "${{ github.event.inputs.action }}" == "Quiz Insights" ]; then
                python run_bot.py --mode insights
             elif [ "${{ github.event.inputs.action }}" == "Motivation Boost" ]; then
                python run_bot.py --mode motivation
             elif [ "${{ github.event.inputs.action }}" == "Evening Reminders" ]; then
                python run_bot.py --mode evening
             else
                python run_bot.py --mode auto
             fi
          else
             python run_bot.py --mode auto
          fi
